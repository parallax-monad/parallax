name: Deploy Demo Day PPT to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/docs-demo-day-ppt-themes
    paths:
      - docs/demo/parallax-demo-day/**
      - .github/workflows/deploy-demo-day-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-day-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Demo Day PPT
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo/parallax-demo-day

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
